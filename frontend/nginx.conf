server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api/... sont relayés vers le conteneur backend
    # ex : /api/entreprise/all  ->  http://backend:8080/entreprise/all
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Toutes les autres URL renvoient index.html (routing Angular)
    # sinon rafraîchir la page /projets donnerait une erreur 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
